<!-- DHBT - MBSTS/site/kaynak/istatistik.py'den üretildi (harezmi.dev/_uret_yonetim.py); elle düzenleme -->
<script>
(function(){
  var H=location.hostname,ac=['dhbtkampi.com','mbstskampi.com','aleskampi.com'].indexOf(H)>=0&&!navigator.webdriver&&navigator.doNotTrack!=='1'&&!navigator.globalPrivacyControl;
  var L=null;try{L=JSON.parse(localStorage.getItem('ist')||'{}')}catch(e){}
  function kaydet(){try{localStorage.setItem('ist',JSON.stringify(L))}catch(e){}}
  if(L){if(/[?&]istatistik=kapat/.test(location.search)){L.kapali=1;kaydet()}else if(/[?&]istatistik=ac/.test(location.search)){delete L.kapali;kaydet()}if(L.kapali)ac=false}
  window.ist=function(){};if(!ac)return;
  var simdi=Date.now(),v={},q=location.search;
  if(!L){v.tur='bilinmiyor'}
  else if(!L.son||simdi-L.son>18e5){  // 30 dakikadan uzun ara = yeni ziyaret
    if(L.n){var a=(simdi-L.son)/864e5;v.tur='donen';v.ara=a<1?'ayni-gun':a<7?'1-7-gun':a<30?'7-30-gun':'30+-gun'}else v.tur='yeni';
    L.n=(L.n||0)+1;v.kac=L.n<2?'1':L.n<6?'2-5':L.n<21?'6-20':'20+'}
  if(L){L.son=simdi;kaydet()}
  var cihaz=matchMedia('(pointer:coarse)').matches?(Math.min(screen.width,screen.height)>=700?'tablet':'mobil'):'masaustu';
  if(v.tur)v.c=cihaz;
  // paylaşım etiketi (?k=tg-gunun-sorusu): sayılır, sonra adres çubuğundan silinir
  var et=(q.match(/[?&]k=([a-z0-9-]{1,40})(&|$)/)||[])[1];
  if(et){v.et=et;try{history.replaceState(null,'',location.pathname+q.replace(/([?&])k=[^&]*&?/,'$1').replace(/[?&]$/,'')+location.hash)}catch(e){}}
  var T=[[/chatgpt|openai/,'chatgpt'],[/perplexity/,'perplexity'],[/gemini\.google|bard\.google/,'gemini'],[/copilot/,'copilot'],[/claude\.ai|anthropic/,'claude'],
    [/deepseek|grok|meta\.ai|mistral|you\.com|phind|kagi/,'yapay-zeka'],[/google\./,'google'],[/bing\./,'bing'],[/yandex\./,'yandex'],[/duckduckgo/,'duckduckgo'],
    [/telegram|(^|\.)t\.me$/,'telegram'],[/instagram/,'instagram'],[/youtube|youtu\.be/,'youtube'],[/facebook|(^|\.)fb\./,'facebook'],
    [/(^|\.)x\.com$|twitter|(^|\.)t\.co$/,'x'],[/whatsapp/,'whatsapp'],[/dhbtkampi|mbstskampi|aleskampi|harezmi/,'kardes-site']];
  function tur(h){for(var i=0;i<T.length;i++)if(T[i][0].test(h))return T[i][1];return 'diger'}
  var r='';try{r=new URL(document.referrer).hostname.replace(/^www\./,'')}catch(e){}
  var utm=(q.match(/[?&]utm_source=([^&]+)/)||[])[1];  // ChatGPT gibi araçlar bağlantıya utm_source ekler
  if(utm)v.k=tur(decodeURIComponent(utm).toLowerCase());
  else if(r&&r!==H)v.k=tur(r);
  else if(v.tur&&!r)v.k='dogrudan';
  function gonder(o,ek,yol){var b={p:yol||location.pathname,o:o};for(var x in ek)b[x]=ek[x];b=JSON.stringify(b);
    try{if(navigator.sendBeacon&&navigator.sendBeacon('https://harezmi.dev/ales-sayac.php',b))return}catch(e){}
    try{fetch('https://harezmi.dev/ales-sayac.php',{method:'POST',body:b,keepalive:true,mode:'no-cors'})}catch(e){}}
  var giden={};window.ist=function(o,d){if(giden[o])return;giden[o]=1;gonder(o,d?{d:d}:{})};
  if(/bulunamad/i.test(document.title)){  // 404 sayfası: istenen adresi say (yalnız güvenli karakterler)
    var y='/';try{y=decodeURIComponent(location.pathname)}catch(e){}
    y=y.toLowerCase().replace(/[^a-z0-9\/_.-]/g,'_').replace(/\.\.+/g,'.').slice(0,150);
    gonder('404',{k:r?(r===H?'site-ici':tur(r)):'dogrudan'},y);return}
  gonder('sayfa',v);
  document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.tsik button');if(!b)return;
    setTimeout(function(){var t=b.closest('.test');if(!t)return;var s=t.querySelectorAll('.tsoru'),c=0,d=0;
      s.forEach(function(q){var x=q.querySelector('.tsik button');if(x&&x.disabled){c++;if(!q.querySelector('.tsik .yanlis'))d++}});
      ist('test-basla');if(c===s.length){var y=d/s.length;ist('test',y<.5?'0-49':y<.8?'50-79':'80-100')}},0)},true);
  // okuma derinliği ve aktif süre (sekme görünür ve son 30 sn içinde etkileşim varsa sayılır)
  var en=0,aktif=0,sonHareket=Date.now();
  function derin(){var h=document.documentElement.scrollHeight;if(h>0)en=Math.max(en,(scrollY+innerHeight)/h)}
  ['scroll','click','keydown','touchstart','mousemove'].forEach(function(o){addEventListener(o,function(){sonHareket=Date.now();if(o==='scroll')derin()},{passive:true})});
  derin();setInterval(function(){if(document.visibilityState==='visible'&&Date.now()-sonHareket<3e4)aktif+=5},5e3);
  // gerçek kullanıcı hızı (destekleyen tarayıcılarda)
  var lcp=0,cls=0,inp=0;
  try{new PerformanceObserver(function(l){var e=l.getEntries();if(e.length)lcp=e[e.length-1].startTime}).observe({type:'largest-contentful-paint',buffered:true})}catch(e){}
  try{new PerformanceObserver(function(l){l.getEntries().forEach(function(e){if(!e.hadRecentInput)cls+=e.value})}).observe({type:'layout-shift',buffered:true})}catch(e){}
  try{new PerformanceObserver(function(l){l.getEntries().forEach(function(e){if(e.interactionId)inp=Math.max(inp,e.duration)})}).observe({type:'event',buffered:true,durationThreshold:40})}catch(e){}
  var cikti=0;
  function cik(){if(cikti)return;cikti=1;derin();
    var x={c:cihaz,dr:en>=.95?'100':en>=.75?'75-100':en>=.5?'50-75':en>=.25?'25-50':'0-25',
      sr:aktif<15?'0-15sn':aktif<60?'15-60sn':aktif<180?'1-3dk':aktif<600?'3-10dk':'10dk+'};
    if(lcp)x.lcp=lcp<2500?'iyi':lcp<4000?'orta':'kotu';
    x.cls=cls<.1?'iyi':cls<.25?'orta':'kotu';
    if(inp)x.inp=inp<200?'iyi':inp<500?'orta':'kotu';
    gonder('cikis',x)}
  addEventListener('pagehide',cik);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')cik()});
})();
</script>
