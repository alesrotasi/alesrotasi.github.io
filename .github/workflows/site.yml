name: Siteyi derle ve yayımla

on:
  push:
    branches: [main]
  schedule:
    # Her gün: bir önceki günün Günün Sorusu sayfaları eklenir (TR ~06:30; GitHub gecikebilir).
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pymupdf
      - run: python kaynak/build.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Güncelleme tarihleri ve etkinlik kaydı (zamanlanmış görev 60 gün sonra kapanmasın)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then ls _site/sorular | grep -c -- "-" > kaynak/yayin_sayisi.txt || true; fi
          git config user.name "ales-rotasi-bot"
          git config user.email "ales-rotasi-bot@users.noreply.github.com"
          git add kaynak/yayin_sayisi.txt kaynak/veri/guncelleme.json
          git diff --cached --quiet || (git commit -q -m "Sayfa güncelleme tarihleri, yayımlanan soru: $(cat kaynak/yayin_sayisi.txt)" && git pull -q --rebase && git push -q)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  yayimla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  indexnow:
    # Yayından sonra Bing, Yandex vb. arama motorlarına sitemap'teki adresleri bildirir (ücretsiz, resmî protokol).
    needs: yayimla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IndexNow bildirimi
        run: |
          python - <<'PY'
          import json, re, urllib.request
          k = open("kaynak/indexnow.txt").read().strip()
          sm = urllib.request.urlopen("https://alesrotasi.github.io/sitemap.xml", timeout=30).read().decode()
          urls = re.findall(r"<loc>([^<]+)</loc>", sm)
          veri = json.dumps({"host": "alesrotasi.github.io", "key": k,
                             "keyLocation": f"https://alesrotasi.github.io/{k}.txt", "urlList": urls}).encode()
          r = urllib.request.Request("https://api.indexnow.org/indexnow", data=veri,
                                     headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              print("IndexNow:", urllib.request.urlopen(r, timeout=30).status, len(urls), "adres")
          except urllib.error.HTTPError as e:
              print("IndexNow yanıtı:", e.code, e.read()[:200])
          PY
